<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>No Leg Left to Stand On</title>
    <!-- All game UI styling lives in src/ui/theme.ts (installed at boot) -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #07060a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
      /* 1280×720 logical layout, CSS-scaled to fit the window (main.ts fitToWindow) */
      #game-container { position: relative; width: 1280px; height: 720px; flex: none; transform-origin: center center; overflow: hidden; }
      #transition-overlay { position: absolute; inset: 0; background: #050403; opacity: 0; pointer-events: none; transition: opacity 400ms ease; z-index: 300; }
      #menu-overlay { display: none; position: absolute; inset: 0; pointer-events: auto; z-index: 150; }
    </style>
  </head>
  <body>
    <div id="game-container">

      <!-- HUD (always visible, no pointer events) -->
      <div id="hud-overlay">
        <div id="zone-label" class="hud-card">Home Base</div>

        <div id="bars-group" class="hud-card">
          <div class="bar-row">
            <span class="bar-label">HP</span>
            <div class="bar-track"><div class="bar-ghost" id="hp-ghost" style="width:100%"></div><div class="bar-fill" id="hp-fill" style="width:100%"></div></div>
            <span class="bar-num" id="hp-num">100</span>
          </div>
          <div class="bar-row">
            <span class="bar-label">STAM</span>
            <div class="bar-track"><div class="bar-fill" id="stam-fill" style="width:100%"></div></div>
            <span class="bar-num" id="stam-num">100</span>
          </div>
          <div class="bar-row">
            <span class="bar-label">ENRG</span>
            <div class="bar-track"><div class="bar-fill" id="energy-fill" style="width:100%"></div></div>
            <span class="bar-num" id="energy-num">100</span>
          </div>
        </div>

        <div id="weapon-ring-wrap">
          <svg id="weapon-ring" width="168" height="168" viewBox="-84 -84 168 168"></svg>
        </div>

        <div id="controls-hint">
          <span><span class="nl-key">WASD</span> move</span>
          <span><span class="nl-key">Click</span> attack</span>
          <span><span class="nl-key">I</span> equip</span>
          <span><span class="nl-key">E</span> interact</span>
          <span><span class="nl-key">Esc</span> menu</span>
        </div>

        <div id="xp-counter" class="hud-card"><span class="xp-label">XP</span><span id="xp-value">0</span></div>
        <div id="interact-hint" class="hud-card"></div>
        <div id="ammo-panel" class="hud-card">THISTLE <b>0</b></div>
        <div id="pickup-notifications"></div>
        <div id="nl-toasts"></div>

        <!-- Boss HP bar — shown only during boss fights -->
        <div id="boss-hp-wrap">
          <div id="boss-hp-label">Boss</div>
          <div id="boss-hp-track"><div id="boss-hp-ghost" style="width:100%"></div><div id="boss-hp-fill" style="width:100%"></div></div>
        </div>
        <!-- Boss callout -->
        <div id="boss-msg"></div>
      </div>

      <!-- Audio mute toggle -->
      <button id="audio-toggle" class="hud-card">SOUND ON</button>

      <!-- Menu overlay (hidden until a menu opens) -->
      <div id="menu-overlay"></div>

      <!-- Full-screen fade overlay for zone transitions -->
      <div id="transition-overlay"></div>

      <!-- Damage vignette — red flash on player hit -->
      <div id="damage-vignette"></div>

    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
